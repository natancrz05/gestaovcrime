name: E2E login temporário

on:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://id-preview--402722ba-7ae3-47b6-aba6-3226bd990bbf.lovable.app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun add --no-save -d @playwright/test
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test tests/e2e-login-temporario.spec.ts --reporter=line
