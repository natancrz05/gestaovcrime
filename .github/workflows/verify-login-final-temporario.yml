name: Verificação final temporária do login

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Testes
        run: bun test
      - name: Typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
