name: Verificação temporária origem produtiva

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install
      - name: Testes
        run: bun test
      - name: Typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Lint
        continue-on-error: true
        run: bun run lint
      - name: Build
        run: bun run build
