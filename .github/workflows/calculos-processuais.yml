name: Auditoria de cálculos processuais
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calculos-processuais.yml'
      - 'src/lib/prazos/**'
      - 'src/lib/assistente*'
      - 'src/routes/_authenticated/calculos.tsx'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/calculos-processuais.yml'
      - 'src/lib/prazos/**'
      - 'src/lib/assistente*'
      - 'src/routes/_authenticated/calculos.tsx'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: calculos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Testes e verificação TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências travadas
        run: bun install --frozen-lockfile
      - name: Testes do módulo e integração IA
        run: bun test tests/prazos-processuais.test.ts tests/calculos-ia.test.ts
      - name: Testes completos do repositório
        run: bun run test
      - name: Compilar e regenerar tipos das rotas TanStack
        run: bun run build
      - name: Diagnóstico da árvore de rotas gerada
        run: git diff -- src/routeTree.gen.ts
      - name: Verificar tipagem TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
